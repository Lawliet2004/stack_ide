name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo check (lib + tests)
        run: |
          set -o pipefail
          cargo check --lib --tests 2>&1 | tee /tmp/check.log
      - name: cargo test (library suite)
        run: |
          set -o pipefail
          cargo test --lib 2>&1 | tee /tmp/lib.log
      - name: cargo test (integration guards)
        run: |
          set -o pipefail
          cargo test --test integration_test 2>&1 | tee /tmp/it.log
      - name: surface failure names as annotations
        if: failure()
        run: |
          for log in /tmp/check.log /tmp/lib.log /tmp/it.log; do
            [ -f "$log" ] || continue
            sed 's/\x1b\[[0-9;]*m//g' "$log" > /tmp/plain.log
            grep -E -A2 "^error(\[E[0-9]+\])?:|^error: " /tmp/plain.log | head -30 |
              while IFS= read -r line; do
                echo "::error title=ci::$line"
              done
            grep -E "^failures:$" -A 25 /tmp/plain.log | head -30 |
              while IFS= read -r line; do
                echo "::error title=ci-failures::$line"
              done
            # Fallback: dump the raw tail so the failure is always visible.
            tail -20 /tmp/plain.log | while IFS= read -r line; do
              echo "::error title=tail::$line"
            done
          done
          exit 0
      - name: cargo clippy
        run: cargo clippy --lib -- -D warnings
        continue-on-error: true
