[package]
name = "blue-ide"
version = "0.1.0"
edition = "2021"

[dependencies]
cosmic-text = "0.12"
eframe = "0.27"
egui = { version = "0.27", features = ["accesskit"] }
indexmap = "2.2"
ropey = "1.6"
rfd = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter = "0.22"
tree-sitter-rust = "0.21"
tree-sitter-python = "0.21"
tree-sitter-javascript = "0.21"
tree-sitter-typescript = "0.21"
lsp-types = "0.95"
regex = "1"
ignore = "0.4"
crossbeam-channel = "0.5"
toml = "0.8"
directories = "5"
git2 = { version = "0.18", default-features = false, features = ["https"] }
portable-pty = "0.8"
uuid = { version = "1", features = ["v4"] }
open = "5"
glob = "0.3"
mlua = { version = "0.9", features = ["lua54", "vendored"] }
similar = "2"
image = { version = "0.24", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
pulldown-cmark = "0.10"
